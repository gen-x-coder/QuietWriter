name: macOS build (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS ${{ matrix.arch }} app
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: intel
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out QuietWriter
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install macOS dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pyinstaller==6.22.3" \
            "PySide6==6.11.2" \
            "requests==2.34.2" \
            "spylls==0.1.7" \
            "python-docx==1.2.0" \
            "lxml==6.1.3" \
            "keyring==25.7.0"
      - name: Verify runner architecture
        run: |
          echo "Runner architecture: $(uname -m)"
          if [ "${{ matrix.arch }}" = "arm64" ]; then test "$(uname -m)" = "arm64"; else test "$(uname -m)" = "x86_64"; fi
      - name: Fetch licensed bundled fonts
        run: python tools/fetch_bundled_fonts.py
      - name: Package macOS app
        run: python -m PyInstaller --noconfirm --clean packaging/quietwriter-macos.spec
      - name: Verify bundle and create downloadable ZIP
        run: |
          test -d dist/QuietWriter.app
          test -f dist/QuietWriter.app/Contents/MacOS/QuietWriter
          ditto -c -k --sequesterRsrc --keepParent dist/QuietWriter.app QuietWriter-1.7.0-macos-${{ matrix.arch }}.zip
      - name: Upload experimental macOS app
        uses: actions/upload-artifact@v4
        with:
          name: QuietWriter-1.7.0-macos-${{ matrix.arch }}
          path: QuietWriter-1.7.0-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
