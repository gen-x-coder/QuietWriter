name: windows-build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
      - name: Enable MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build clean portable release
        shell: cmd
        run: build_exe.cmd
      - name: Smoke test executable
        timeout-minutes: 5
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $v = (Select-String -Path quietwriter\__init__.py -Pattern '__version__\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $exe = "release\QuietWriter-$v\QuietWriter.exe"
          if (-not (Test-Path $exe)) { Write-Error "Executable ontbreekt: $exe"; exit 1 }
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { Write-Error "Smoke test faalde met exitcode $($process.ExitCode)"; exit $process.ExitCode }
      - name: Upload development build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuietWriter-development-build
          path: release/QuietWriter-*-windows-portable.zip
