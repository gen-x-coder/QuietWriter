name: windows-build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install pinned pip and Velopack CLI
        shell: pwsh
        run: |
          python -m pip install --upgrade pip==26.2.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $line = Get-Content packaging/requirements-runtime.lock | Where-Object { $_ -match '^velopack==' } | Select-Object -First 1
          if (-not $line) { throw 'No pinned velopack version in runtime lock' }
          $version = $line.Substring('velopack=='.Length).Trim()
          dotnet tool install --global vpk --version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Enable MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build clean portable release
        shell: cmd
        run: build_exe.cmd
      - name: Smoke test executable
        timeout-minutes: 5
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $v = (Select-String -Path quietwriter\__init__.py -Pattern '__version__\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $exe = "release\QuietWriter-$v\QuietWriter.exe"
          if (-not (Test-Path $exe)) { throw "Executable ontbreekt: $exe" }
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Smoke test faalde met exitcode $($process.ExitCode)" }
      - name: Smoke test portable zip
        shell: pwsh
        run: |
          python -c "import zipfile; p='release/QuietWriter-windows-portable.zip'; z=zipfile.ZipFile(p); names={n.replace(chr(92),'/').lower() for n in z.namelist()}; required={'update.exe','current/quietwriter.exe'}; missing=required-names; print('Portable zip OK' if not missing else 'Missing: '+str(sorted(missing))); exit(bool(missing))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload portable ZIP and Velopack release assets
        uses: actions/upload-artifact@v4
        with:
          name: QuietWriter-1.7.0-release-assets
          if-no-files-found: error
          path: |
            release/QuietWriter-windows-portable.zip
            release/QuietWriter-windows-portable.zip.sha256
            release/QuietWriter-*-build-manifest.txt
            release/velopack/*-full.nupkg
            release/velopack/releases.pilot.json
            release/velopack/releases.win.json
