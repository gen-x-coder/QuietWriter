name: windows-build

# Private development workflow for QuietWriter-dev.
# Tags v* build, test and publish the Windows portable package to the
# public download repository gen-x-coder/QuietWriter.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  PUBLIC_RELEASE_REPO: gen-x-coder/QuietWriter

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build clean portable release
        shell: cmd
        run: build_exe.cmd

      - name: Smoke test executable
        timeout-minutes: 5
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $v = (Select-String -Path quietwriter\__init__.py -Pattern '__version__\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $exe = "release\QuietWriter-$v\QuietWriter.exe"
          if (-not (Test-Path $exe)) { Write-Error "Executable ontbreekt: $exe"; exit 1 }
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru
          $exitCode = $process.ExitCode
          if ($exitCode -ne 0) { Write-Error "QuietWriter smoke test faalde met exitcode $exitCode"; exit $exitCode }
          Write-Host "QuietWriter.exe volledige startup-smoketest: OK (exitcode 0)"

      - name: Verify release hygiene
        shell: pwsh
        run: |
          $v = (Select-String -Path quietwriter\__init__.py -Pattern '__version__\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $out = "release\QuietWriter-$v"
          if (-not (Test-Path (Join-Path $out 'LEESMIJ.txt'))) { Write-Error 'LEESMIJ.txt ontbreekt naast QuietWriter.exe'; exit 1 }
          if (Test-Path (Join-Path $out '_internal\LEESMIJ.txt')) { Write-Error 'LEESMIJ.txt staat onterecht in _internal'; exit 1 }
          foreach ($bad in @('ppm','tests','.git','QuietWriter DEV.cmd','QuietWriter PROD.cmd')) {
            if (Test-Path (Join-Path $out $bad)) { Write-Error "Verboden release-item: $bad"; exit 1 }
          }
          $reports = Get-ChildItem $out -Recurse -File | Where-Object { $_.Name -match '^(REVIEW_NOTES_|QUIETWRITER_REVIEW_FINDINGS_|TUSSENTIJDS_RAPPORT_)' }
          if ($reports) { $reports | ForEach-Object { Write-Error "Ontwikkelrapport in release: $($_.FullName)" }; exit 1 }
          Write-Host "Release hygiene: OK"

      - name: Prepare downloadable assets
        id: artifact
        shell: pwsh
        run: |
          $v = (Select-String -Path quietwriter\__init__.py -Pattern '__version__\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $versioned = "release\QuietWriter-$v-windows-portable.zip"
          $versionedHash = "$versioned.sha256"
          if (-not (Test-Path $versioned)) { Write-Error "Release-ZIP ontbreekt: $versioned"; exit 1 }
          if (-not (Test-Path $versionedHash)) { Write-Error "SHA256-bestand ontbreekt: $versionedHash"; exit 1 }
          Copy-Item -Force $versioned "release\QuietWriter-windows-portable.zip"
          $hash = (Get-FileHash "release\QuietWriter-windows-portable.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  QuietWriter-windows-portable.zip" | Out-File -Encoding ascii "release\QuietWriter-windows-portable.zip.sha256"
          "version=$v" >> $env:GITHUB_OUTPUT
          "versioned=QuietWriter-$v-windows-portable.zip" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.versioned }}
          path: |
            release/QuietWriter-windows-portable.zip
            release/QuietWriter-windows-portable.zip.sha256

      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $expected = "v${{ steps.artifact.outputs.version }}"
          if ("${{ github.ref_name }}" -ne $expected) {
            Write-Error "Tag ${{ github.ref_name }} komt niet overeen met applicatieversie $expected"
            exit 1
          }

      - name: Publish release to public QuietWriter repository
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.QUIETWRITER_RELEASE_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { Write-Error "Secret QUIETWRITER_RELEASE_TOKEN ontbreekt in QuietWriter-dev"; exit 1 }
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.artifact.outputs.version }}"
          $isPrerelease = $tag.Contains("-rc") -or $tag.StartsWith("v0.")
          $notes = "documents\RELEASE_NOTES_$version.md"
          $assets = @("release\QuietWriter-windows-portable.zip", "release\QuietWriter-windows-portable.zip.sha256")
          gh release view $tag --repo $env:PUBLIC_RELEASE_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo $env:PUBLIC_RELEASE_REPO --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $editArgs = @("release", "edit", $tag, "--repo", $env:PUBLIC_RELEASE_REPO, "--title", "QuietWriter $version")
            if ($isPrerelease) { $editArgs += "--prerelease" } else { $editArgs += "--latest" }
            & gh @editArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $createArgs = @("release", "create", $tag, $assets[0], $assets[1], "--repo", $env:PUBLIC_RELEASE_REPO, "--title", "QuietWriter $version")
            if (Test-Path $notes) { $createArgs += @("--notes-file", $notes) } else { $createArgs += "--generate-notes" }
            if ($isPrerelease) { $createArgs += "--prerelease" } else { $createArgs += "--latest" }
            & gh @createArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Write-Host "Public release klaar: $env:PUBLIC_RELEASE_REPO / $tag"
