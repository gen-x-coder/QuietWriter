name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest PySide6 requests spylls pyyaml
      - name: Current suite
        run: python -m pytest
      - name: Current Qt subset
        run: python -m pytest -m qt
      - name: Legacy suite
        run: python -m pytest tests/legacy
      - name: Legacy Qt subset
        run: python -m pytest tests/legacy -m qt
