name: Linux build (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux x86_64 portable
    runs-on: ubuntu-22.04
    steps:
      - name: Check out QuietWriter
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - name: Install application and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pyinstaller==6.22.3" \
            "PySide6==6.11.2" \
            "requests==2.34.2" \
            "spylls==0.1.7" \
            "python-docx==1.2.0" \
            "lxml==6.1.3" \
            "keyring==25.7.0"
      - name: Fetch bundled fonts
        run: python tools/fetch_bundled_fonts.py
      - name: Build portable Linux application
        run: python -m PyInstaller --noconfirm --clean packaging/quietwriter-linux.spec
      - name: Check executable and archive
        run: |
          test "$(uname -m)" = "x86_64"
          test -x dist/QuietWriter/QuietWriter
          tar -C dist -czf QuietWriter-linux-x86_64-portable.tar.gz QuietWriter
          tar -tzf QuietWriter-linux-x86_64-portable.tar.gz | grep -q 'QuietWriter/QuietWriter'
      - name: Upload experimental Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuietWriter-linux-x86_64-portable
          path: QuietWriter-linux-x86_64-portable.tar.gz
          if-no-files-found: error
          retention-days: 14
